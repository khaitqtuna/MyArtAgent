name: Build iPadOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Tai code ve may Mac ao
        uses: actions/checkout@v4

      - name: Tai va sua loi phien ban iOS cho thu vien AI
        run: |
          git clone --depth 1 https://github.com/ml-explore/mlx-swift-examples.git
          python3 -c 'import re, pathlib; p = pathlib.Path("mlx-swift-examples/Package.swift"); p.write_text(re.sub(r"\.iOS\([^)]+\)", ".iOS(.v17)", p.read_text()))'
          grep -n "iOS" mlx-swift-examples/Package.swift || true

      - name: Cai dat XcodeGen
        run: brew install xcodegen

      - name: Tu dong tao du an Xcode
        run: xcodegen generate

      - name: Bien dich app cho iPad
        run: |
          xcodebuild -project MyArtAgent.xcodeproj \
            -scheme MyArtAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Dong goi thanh file IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MyArtAgent.app Payload/
          zip -r MyArtAgent.ipa Payload

      - name: Luu file IPA de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: MyArtAgent-IPA
          path: MyArtAgent.ipa
