name: Build iPadOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_VERSION: v6

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Tai code ve may Mac ao
        uses: actions/checkout@v4

      - name: Lay thong tin Xcode va macOS cho cache key
        id: meta
        run: |
          XCODE_VER=$(xcodebuild -version | tr '\n' '-' | tr -s ' ' | tr ' ' '_')
          echo "xcode=$XCODE_VER" >> "$GITHUB_OUTPUT"

      - name: Khoi phuc cache thu vien & DerivedData
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            mlx-swift-examples
            build
            MyArtAgent.xcodeproj
          key: xcode-${{ env.CACHE_VERSION }}-${{ steps.meta.outputs.xcode }}-${{ hashFiles('project.yml', 'MyArtAgent.entitlements') }}
          restore-keys: |
            xcode-${{ env.CACHE_VERSION }}-${{ steps.meta.outputs.xcode }}-

      - name: Tai va sua loi phien ban iOS cho thu vien AI (neu chua co cache)
        run: |
          if [ ! -d "mlx-swift-examples" ]; then
            git clone --depth 1 https://github.com/ml-explore/mlx-swift-examples.git
            python3 -c 'import re, pathlib; p = pathlib.Path("mlx-swift-examples/Package.swift"); p.write_text(re.sub(r"\.iOS\([^)]+\)", ".iOS(.v17)", p.read_text()))'
          else
            echo "Dung lai mlx-swift-examples tu cache."
          fi
          python3 - <<'PY'
          import pathlib

          # 1. Patch VAE.swift de eval & clearCache sau tung block do phan giai cao, tranh tran RAM Metal luc decode
          vae_path = pathlib.Path("mlx-swift-examples/Libraries/StableDiffusion/VAE.swift")
          vae_text = vae_path.read_text()

          old_ed_block = "\n".join([
              "        for resnet in resnets {",
              "            x = resnet(x)",
              "        }",
          ])
          new_ed_block = "\n".join([
              "        for resnet in resnets {",
              "            x = resnet(x)",
              "            if x.dim(1) >= 256 {",
              "                eval(x)",
              "                Memory.clearCache()",
              "            }",
              "        }",
          ])
          if old_ed_block in vae_text and "x.dim(1) >= 256" not in vae_text:
              vae_text = vae_text.replace(old_ed_block, new_ed_block)

          old_decoder_call = "\n".join([
              "        for l in upBlocks {",
              "            x = l(x)",
              "        }",
          ])
          new_decoder_call = "\n".join([
              "        for l in upBlocks {",
              "            x = l(x)",
              "            eval(x)",
              "            Memory.clearCache()",
              "        }",
          ])
          if old_decoder_call in vae_text and "for l in upBlocks {\n            x = l(x)\n            eval(x)" not in vae_text:
              vae_text = vae_text.replace(old_decoder_call, new_decoder_call)

          vae_path.write_text(vae_text)

          # 2. Patch Load.swift voi DecoderOnlyAutoencoder, autoreleasepool moi buoc, va 3 pha tuan tu
          load_path = pathlib.Path("mlx-swift-examples/Libraries/StableDiffusion/Load.swift")
          load_text = load_path.read_text()

          old_load_weights = "\n".join([
              "func loadWeights(",
              "    url: URL, model: Module, mapper: (String, MLXArray) -> [(String, MLXArray)], dType: DType",
              ") throws {",
              "    let weights = try loadArrays(url: url).flatMap { mapper($0.key, $0.value.asType(dType)) }",
              "",
              "    // Note: not using verifier because some shapes change upon load",
              "    try model.update(parameters: ModuleParameters.unflattened(weights), verify: .none)",
              "}",
          ])
          new_load_weights = "\n".join([
              "func loadWeights(",
              "    url: URL, model: Module, mapper: (String, MLXArray) -> [(String, MLXArray)], dType: DType",
              ") throws {",
              "    try autoreleasepool {",
              "        let raw = try loadArrays(url: url)",
              "        var weights: [(String, MLXArray)] = []",
              "        weights.reserveCapacity(raw.count)",
              "        for (k, v) in raw {",
              "            let mapped = mapper(k, v)",
              "            if mapped.isEmpty { continue }",
              "            for (mk, mv) in mapped {",
              "                weights.append((mk, mv.dtype == dType ? mv : mv.asType(dType)))",
              "            }",
              "        }",
              "        try model.update(parameters: ModuleParameters.unflattened(weights), verify: .none)",
              "    }",
              "    Memory.clearCache()",
              "}",
          ])
          if old_load_weights in load_text:
              load_text = load_text.replace(old_load_weights, new_load_weights)

          if "DecoderOnlyAutoencoder" not in load_text:
              addition = """
          public struct SequencePromptItem: Sendable {
              public let prompt: String
              public let negativePrompt: String
              public let seed: UInt64

              public init(prompt: String, negativePrompt: String, seed: UInt64) {
                  self.prompt = prompt
                  self.negativePrompt = negativePrompt
                  self.seed = seed
              }
          }

          private final class DecoderOnlyAutoencoder: Module {
              let scalingFactor: Float
              let decoder: VADecoder
              @ModuleInfo(key: "post_quant_proj") var postQuantProjection: Linear

              init(configuration: AutoencoderConfiguration) {
                  self.scalingFactor = configuration.scalingFactor
                  self.decoder = VADecoder(
                      inputChannels: configuration.latentChannelsIn,
                      outputChannels: configuration.outputChannels,
                      blockOutChannels: configuration.blockOutChannels,
                      layersPerBlock: configuration.layersPerBlock + 1,
                      resnetGroups: configuration.normNumGroups)
                  self._postQuantProjection.wrappedValue = Linear(
                      configuration.latentChannelsIn, configuration.latentChannelsIn)
              }

              func decode(_ z: MLXArray) -> MLXArray {
                  let zScaled = z.asType(.float32) / scalingFactor
                  return decoder(postQuantProjection(zScaled))
              }
          }

          private func loadDecoderOnlyAutoEncoder(
              client: HubClient, configuration: StableDiffusionConfiguration
          ) throws -> DecoderOnlyAutoencoder {
              let vaeConfig = try loadConfiguration(
                  client: client, configuration: configuration, key: .vaeConfig,
                  type: AutoencoderConfiguration.self)
              let model = DecoderOnlyAutoencoder(configuration: vaeConfig)
              let weightsURL = try resolve(client: client, configuration: configuration, key: .vaeWeights)
              try loadWeights(
                  url: weightsURL,
                  model: model,
                  mapper: { key, value in
                      if key.hasPrefix("encoder.") || key.hasPrefix("quant_conv") {
                          return []
                      }
                      return vaeRemap(key: key, value: value)
                  },
                  dType: .float32)
              return model
          }

          extension StableDiffusionConfiguration {
              public static func sd15FP16(
                  id: String,
                  useFP16Suffix: Bool = true,
                  cfgWeight: Float = 7.5,
                  steps: Int = 20
              ) -> StableDiffusionConfiguration {
                  let weightSuffix = useFP16Suffix ? ".fp16.safetensors" : ".safetensors"
                  return StableDiffusionConfiguration(
                      id: id,
                      files: [
                          .unetConfig: "unet/config.json",
                          .unetWeights: "unet/diffusion_pytorch_model\\(weightSuffix)",
                          .textEncoderConfig: "text_encoder/config.json",
                          .textEncoderWeights: "text_encoder/model\\(weightSuffix)",
                          .vaeConfig: "vae/config.json",
                          .vaeWeights: "vae/diffusion_pytorch_model\\(weightSuffix)",
                          .diffusionConfig: "scheduler/scheduler_config.json",
                          .tokenizerVocabulary: "tokenizer/vocab.json",
                          .tokenizerMerges: "tokenizer/merges.txt",
                      ],
                      defaultParameters: { EvaluateParameters(cfgWeight: cfgWeight, steps: steps) },
                      factory: { client, sdConfiguration, loadConfiguration in
                          let sd = try StableDiffusionBase(
                              client: client, configuration: sdConfiguration, dType: loadConfiguration.dType)
                          if loadConfiguration.quantize {
                              quantize(model: sd.textEncoder, filter: { k, m in m is Linear })
                              quantize(model: sd.unet, groupSize: 32, bits: 8)
                              Memory.clearCache()
                          }
                          return sd
                      }
                  )
              }

              public static func sdxl(
                  id: String,
                  useFP16Suffix: Bool = false,
                  cfgWeight: Float = 6.0,
                  steps: Int = 20
              ) -> StableDiffusionConfiguration {
                  let weightSuffix = useFP16Suffix ? ".fp16.safetensors" : ".safetensors"
                  return StableDiffusionConfiguration(
                      id: id,
                      files: [
                          .unetConfig: "unet/config.json",
                          .unetWeights: "unet/diffusion_pytorch_model\\(weightSuffix)",
                          .textEncoderConfig: "text_encoder/config.json",
                          .textEncoderWeights: "text_encoder/model\\(weightSuffix)",
                          .textEncoderConfig2: "text_encoder_2/config.json",
                          .textEncoderWeights2: "text_encoder_2/model\\(weightSuffix)",
                          .vaeConfig: "vae/config.json",
                          .vaeWeights: "vae/diffusion_pytorch_model\\(weightSuffix)",
                          .diffusionConfig: "scheduler/scheduler_config.json",
                          .tokenizerVocabulary: "tokenizer/vocab.json",
                          .tokenizerMerges: "tokenizer/merges.txt",
                          .tokenizerVocabulary2: "tokenizer_2/vocab.json",
                          .tokenizerMerges2: "tokenizer_2/merges.txt",
                      ],
                      defaultParameters: { EvaluateParameters(cfgWeight: cfgWeight, steps: steps) },
                      factory: { client, sdConfiguration, loadConfiguration in
                          let sd = try StableDiffusionXL(
                              client: client, configuration: sdConfiguration, dType: loadConfiguration.dType)
                          if loadConfiguration.quantize {
                              quantize(model: sd.textEncoder, filter: { k, m in m is Linear })
                              quantize(model: sd.textEncoder2, filter: { k, m in m is Linear })
                              quantize(model: sd.unet, groupSize: 32, bits: 8)
                              Memory.clearCache()
                          }
                          return sd
                      }
                  )
              }

              private static func tokenizePair(
                  tokenizer: CLIPTokenizer,
                  text: String,
                  negativeText: String?
              ) -> MLXArray {
                  var tokens = [tokenizer.tokenize(text: text)]
                  if let negativeText {
                      tokens.append(tokenizer.tokenize(text: negativeText))
                  }
                  let count = tokens.count
                  let maxLen = tokens.map { $0.count }.max() ?? 0
                  let flat = tokens.map { $0 + Array(repeating: Int32(0), count: maxLen - $0.count) }.flatMap { $0 }
                  return MLXArray(flat).reshaped(count, maxLen)
              }

              /// Chạy tuần tự 3 pha (TextEncoder -> UNet -> Decoder-only VAE), giải phóng hoàn toàn từng pha & autoreleasepool.
              public func runLowMemorySequence(
                  client: HubClient = .default,
                  items: [SequencePromptItem],
                  isSDXL: Bool,
                  steps: Int,
                  cfgWeight: Float,
                  latentSize: [Int],
                  unetBits: Int = 8,
                  onProgress: @Sendable (String) -> Void,
                  onDecodedImage: @Sendable (Int, MLXArray) throws -> Void
              ) throws {
                  guard !items.isEmpty else { return }
                  let dType: DType = .float16
                  let diffusionConfig = try loadDiffusionConfiguration(client: client, configuration: self)
                  let vaeConfig = try loadConfiguration(
                      client: client, configuration: self, key: .vaeConfig, type: AutoencoderConfiguration.self)
                  let latentChannels = vaeConfig.latentChannelsIn

                  // PHA 1: Nạp Text Encoder, mã hóa toàn bộ prompt rồi giải phóng hoàn toàn
                  var encodedPrompts: [(conditioning: MLXArray, pooled: MLXArray?)] = []
                  onProgress("Pha 1/3: Đang nạp Text Encoder...")
                  try autoreleasepool {
                      let tokenizer1 = try loadTokenizer(client: client, configuration: self)
                      var te1: CLIPTextModel? = try loadTextEncoder(client: client, configuration: self, dType: dType)
                      quantize(model: te1!, filter: { _, m in m is Linear })
                      eval(te1!)
                      Memory.clearCache()

                      var tokenizer2: CLIPTokenizer? = nil
                      var te2: CLIPTextModel? = nil
                      if isSDXL {
                          tokenizer2 = try loadTokenizer(
                              client: client, configuration: self,
                              vocabulary: .tokenizerVocabulary2, merges: .tokenizerMerges2)
                          te2 = try loadTextEncoder(
                              client: client, configuration: self,
                              configKey: .textEncoderConfig2, weightsKey: .textEncoderWeights2, dType: dType)
                          quantize(model: te2!, filter: { _, m in m is Linear })
                          eval(te2!)
                          Memory.clearCache()
                      }

                      onProgress("Pha 1/3: Đang mã hóa \\(items.count) câu lệnh...")
                      for item in items {
                          autoreleasepool {
                              let neg: String? = cfgWeight > 1 ? item.negativePrompt : nil
                              let tokens1 = Self.tokenizePair(tokenizer: tokenizer1, text: item.prompt, negativeText: neg)
                              let out1 = te1!(tokens1)
                              if isSDXL, let te2, let tokenizer2 {
                                  let tokens2 = Self.tokenizePair(tokenizer: tokenizer2, text: item.prompt, negativeText: neg)
                                  let out2 = te2(tokens2)
                                  let cond = concatenated(
                                      [out1.hiddenStates.dropLast().last!, out2.hiddenStates.dropLast().last!],
                                      axis: -1)
                                  let pooled = out2.pooledOutput
                                  eval(cond, pooled)
                                  encodedPrompts.append((cond, pooled))
                              } else {
                                  let cond = out1.lastHiddenState
                                  eval(cond)
                                  encodedPrompts.append((cond, nil))
                              }
                          }
                          Memory.clearCache()
                      }
                      te1 = nil
                      te2 = nil
                      tokenizer2 = nil
                  }
                  Memory.clearCache()

                  // PHA 2: Nạp UNet đơn lẻ, tạo toàn bộ latent (~128 KB/ảnh) rồi giải phóng UNet hoàn toàn
                  var latentsOut: [MLXArray] = []
                  onProgress("Pha 2/3: Đang nạp UNet (\\(unetBits)-bit tiết kiệm RAM)...")
                  try autoreleasepool {
                      var unet: UNetModel? = try loadUnet(client: client, configuration: self, dType: dType)
                      quantize(model: unet!, groupSize: 32, bits: unetBits)
                      eval(unet!)
                      Memory.clearCache()

                      let sampler: SimpleEulerSampler = isSDXL
                          ? SimpleEulerAncestralSampler(configuration: diffusionConfig)
                          : SimpleEulerSampler(configuration: diffusionConfig)
                      let timeSteps = sampler.timeSteps(steps: steps, start: sampler.maxTime, dType: dType)

                      for (idx, item) in items.enumerated() {
                          let frameNum = idx + 1
                          MLXRandom.seed(item.seed)
                          let encoded = encodedPrompts[idx]

                          var textTime: (MLXArray, MLXArray)? = nil
                          if isSDXL, let pooled = encoded.pooled {
                              let targetH = Double(latentSize[0] * 8)
                              let targetW = Double(latentSize[1] * 8)
                              let timeIds: [Double] = [targetH, targetW, 0.0, 0.0, targetH, targetW]
                              textTime = (
                                  pooled,
                                  repeated(MLXArray(converting: timeIds).reshaped(1, -1), count: pooled.count, axis: 0)
                              )
                          }

                          var xt = sampler.samplePrior(shape: [1] + latentSize + [latentChannels], dType: dType)
                          eval(xt)
                          Memory.clearCache()

                          for (stepIdx, (t, tPrev)) in timeSteps.enumerated() {
                              onProgress(items.count > 1
                                  ? "Ảnh \\(frameNum)/\\(items.count) — bước \\(stepIdx + 1)/\\(steps)..."
                                  : "Đang vẽ bước \\(stepIdx + 1)/\\(steps)...")

                              autoreleasepool {
                                  let xtUnet = cfgWeight > 1 ? concatenated([xt, xt], axis: 0) : xt
                                  let tUnet = broadcast(t, to: [xtUnet.count])
                                  var epsPred = unet!(xtUnet, timestep: tUnet, encoderX: encoded.conditioning, textTime: textTime)
                                  if cfgWeight > 1 {
                                      let (epsText, epsNeg) = epsPred.split()
                                      epsPred = epsNeg + cfgWeight * (epsText - epsNeg)
                                  }
                                  xt = sampler.step(epsPred: epsPred, xt: xt, t: t, tPrev: tPrev)
                                  eval(xt)
                              }
                              Memory.clearCache()
                          }
                          latentsOut.append(xt)
                      }
                      unet = nil
                  }
                  encodedPrompts.removeAll()
                  Memory.clearCache()
                  Thread.sleep(forTimeInterval: 0.25)

                  // PHA 3: Chỉ nạp Decoder của VAE (không nạp VAEncoder), giải mã từng block/ảnh một
                  onProgress("Pha 3/3: Đang nạp bộ giải mã VAE...")
                  try autoreleasepool {
                      var vae: DecoderOnlyAutoencoder? = try loadDecoderOnlyAutoEncoder(client: client, configuration: self)
                      eval(vae!)
                      Memory.clearCache()

                      for (idx, latent) in latentsOut.enumerated() {
                          onProgress(items.count > 1
                              ? "Pha 3/3: Đang giải mã ảnh \\(idx + 1)/\\(items.count)..."
                              : "Đang hoàn thiện chi tiết ảnh...")
                          try autoreleasepool {
                              var decoded: MLXArray? = vae!.decode(latent)
                              decoded = clip(decoded! / 2 + 0.5, min: 0, max: 1)
                              eval(decoded!)
                              try onDecodedImage(idx, decoded!)
                              decoded = nil
                          }
                          Memory.clearCache()
                      }
                      vae = nil
                  }
                  latentsOut.removeAll()
                  Memory.clearCache()
              }
          }
          """
              load_text = load_text + "\n" + addition

          load_path.write_text(load_text)

          sd_path = pathlib.Path("mlx-swift-examples/Libraries/StableDiffusion/StableDiffusion.swift")
          sd_text = sd_path.read_text()
          old_block = "\n".join([
              "        let textTime = (",
              "            pooledConditioning,",
              "            repeated(",
              "                MLXArray(converting: [512.0, 512, 0, 0, 512, 512]).reshaped(1, -1),",
              "                count: pooledConditioning.count, axis: 0)",
              "        )",
          ])
          new_block = "\n".join([
              "        let targetH = Double(parameters.latentSize[0] * 8)",
              "        let targetW = Double(parameters.latentSize[1] * 8)",
              "        let timeIds: [Double] = [targetH, targetW, 0.0, 0.0, targetH, targetW]",
              "        let textTime = (",
              "            pooledConditioning,",
              "            repeated(",
              "                MLXArray(converting: timeIds).reshaped(1, -1),",
              "                count: pooledConditioning.count, axis: 0)",
              "        )",
          ])
          if old_block in sd_text:
              sd_path.write_text(sd_text.replace(old_block, new_block))
          PY

      - name: Cai dat XcodeGen (neu chua co)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi

      - name: Tao hoac giu nguyen du an Xcode
        run: |
          if [ -d "MyArtAgent.xcodeproj" ]; then
            cp -R MyArtAgent.xcodeproj MyArtAgent.xcodeproj.bak
          fi
          xcodegen generate
          if [ -d "MyArtAgent.xcodeproj.bak" ] && diff -q MyArtAgent.xcodeproj/project.pbxproj MyArtAgent.xcodeproj.bak/project.pbxproj >/dev/null 2>&1; then
            echo "project.pbxproj khong doi, giu nguyen cache MyArtAgent.xcodeproj & Package.resolved."
            rm -rf MyArtAgent.xcodeproj
            mv MyArtAgent.xcodeproj.bak MyArtAgent.xcodeproj
          else
            if [ -f "MyArtAgent.xcodeproj.bak/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" ]; then
              mkdir -p MyArtAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
              cp MyArtAgent.xcodeproj.bak/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
                 MyArtAgent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            fi
            rm -rf MyArtAgent.xcodeproj.bak
          fi

      - name: Bien dich app cho iPad
        run: |
          xcodebuild -project MyArtAgent.xcodeproj \
            -scheme MyArtAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Dong goi thanh file IPA
        run: |
          rm -rf Payload MyArtAgent.ipa
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MyArtAgent.app Payload/
          zip -rq MyArtAgent.ipa Payload

      - name: Luu file IPA de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: MyArtAgent-IPA
          path: MyArtAgent.ipa

      - name: Don dep log va xem dung luong cache
        run: |
          rm -rf build/Logs
          du -sh mlx-swift-examples MyArtAgent.xcodeproj build build/* 2>/dev/null || true
